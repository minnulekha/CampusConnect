{% extends 'base.html' %}

{% block title %}Sign In - FacultyConnect{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-900 text-center">Welcome Back</h2>
        <p class="text-sm text-gray-500 text-center mt-1">Sign in to sync your schedule or search faculty.</p>
    </div>

    {% if form.errors %}
        <div class="p-3 text-sm rounded-md bg-red-50 border border-red-200 text-red-700">
            Your username and password didn't match. Please try again.
        </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Username</label>
            <input type="text" name="username" required class="w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm">
        </div>
        <div>
            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Password</label>
            <input type="password" name="password" required class="w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition text-sm">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
