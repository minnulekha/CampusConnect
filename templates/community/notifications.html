{% extends 'base.html' %}

{% block title %}Alert Inbox{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-4">
    <h1 class="text-2xl font-bold text-gray-900">Your Campus Notifications</h1>
    
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden divide-y divide-gray-100">
        {% for note in notifications %}
            <div class="p-4 {% if not note.is_read %}bg-indigo-50/50{% endif %} flex items-start space-x-3 text-sm">
                <span class="text-lg">🔔</span>
                <div class="flex-1">
                    <p class="text-gray-800 font-medium">{{ note.message }}</p>
                    <span class="text-xs text-gray-400 block mt-1">{{ note.created_at|timesince }} ago</span>
                </div>
            </div>
        {% empty %}
            <div class="p-8 text-center text-gray-500 text-sm">
                Your notification tray is currently empty.
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
